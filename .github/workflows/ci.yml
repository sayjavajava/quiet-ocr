name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Pulls the OCR engine + trained-data from installed npm packages into
      # public/vendor/ — see scripts/copy-vendor-assets.mjs for why these
      # are self-hosted rather than left pointing at a third-party CDN.
      - name: Build (copy vendor assets)
        run: npm run build

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The load-bearing check: loads the real built page in a real
      # browser, uploads a fixture image with known text through the
      # actual file-input UI, and confirms both that OCR genuinely
      # recognizes it and that no network request carries anything
      # derived from the image. A green `npm run build` alone proves
      # nothing about either — this is what actually verifies the
      # project's two real claims.
      - name: Verify OCR works and nothing is transmitted
        run: npm run verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
